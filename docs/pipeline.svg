<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="chev" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M2,1 L9,6 L2,11" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="#ffffff"/>

  <!-- title -->
  <text x="800" y="58" font-size="30" font-weight="700" fill="#0f172a" text-anchor="middle">HoVer 사실 검증 파이프라인</text>

  <!-- stage bands -->
  <g font-size="16" font-weight="700">
    <rect x="300" y="92" width="730" height="36" rx="18" fill="#dbeafe"/>
    <text x="665" y="116" text-anchor="middle" fill="#1d4ed8">① 후보 문서 찾기</text>
    <rect x="1080" y="92" width="210" height="36" rx="18" fill="#d1fae5"/>
    <text x="1185" y="116" text-anchor="middle" fill="#047857">② 근거 문장 고르기</text>
    <rect x="1340" y="92" width="210" height="36" rx="18" fill="#ede9fe"/>
    <text x="1445" y="116" text-anchor="middle" fill="#6d28d9">③ 판정</text>
  </g>

  <!-- cards: x = 50, 310, 570, 820(+?) ... width 210, gap 50 -->
  <!-- card 1: claim -->
  <g filter="url(#shadow)"><rect x="50" y="150" width="210" height="250" rx="20" fill="#ffffff" stroke="#e2e8f0"/></g>
  <circle cx="155" cy="222" r="42" fill="#f1f5f9"/>
  <path d="M130,204 h50 a8,8 0 0 1 8,8 v24 a8,8 0 0 1 -8,8 h-28 l-12,10 v-10 h-10 a8,8 0 0 1 -8,-8 v-24 a8,8 0 0 1 8,-8 z" fill="#334155"/>
  <rect x="138" y="215" width="34" height="4" rx="2" fill="#ffffff"/>
  <rect x="138" y="225" width="24" height="4" rx="2" fill="#ffffff"/>
  <text x="155" y="300" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">claim</text>
  <text x="155" y="330" font-size="14" fill="#64748b" text-anchor="middle">참·거짓을 판정할</text>
  <text x="155" y="350" font-size="14" fill="#64748b" text-anchor="middle">주장 문장</text>

  <!-- card 2: entity linking -->
  <g filter="url(#shadow)"><rect x="310" y="150" width="210" height="250" rx="20" fill="#ffffff" stroke="#bfdbfe"/></g>
  <circle cx="415" cy="222" r="42" fill="#dbeafe"/>
  <circle cx="408" cy="215" r="15" fill="none" stroke="#2563eb" stroke-width="5"/>
  <line x1="419" y1="226" x2="433" y2="240" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
  <text x="415" y="300" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">시작 문서 찾기</text>
  <text x="415" y="330" font-size="14" fill="#64748b" text-anchor="middle">claim 속 개체명을</text>
  <text x="415" y="350" font-size="14" fill="#64748b" text-anchor="middle">위키 문서 제목에 연결</text>

  <!-- card 3: graph search -->
  <g filter="url(#shadow)"><rect x="570" y="150" width="210" height="250" rx="20" fill="#ffffff" stroke="#bfdbfe"/></g>
  <circle cx="675" cy="222" r="42" fill="#dbeafe"/>
  <g stroke="#2563eb" stroke-width="3">
    <line x1="656" y1="236" x2="676" y2="206"/>
    <line x1="676" y1="206" x2="698" y2="230"/>
    <line x1="656" y1="236" x2="698" y2="230"/>
  </g>
  <circle cx="656" cy="236" r="8" fill="#2563eb"/>
  <circle cx="676" cy="206" r="8" fill="#2563eb"/>
  <circle cx="698" cy="230" r="9" fill="#f59e0b"/>
  <text x="675" y="300" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">링크 따라 탐색</text>
  <text x="675" y="330" font-size="14" fill="#64748b" text-anchor="middle">위키 링크를 따라가며</text>
  <text x="675" y="350" font-size="14" fill="#64748b" text-anchor="middle">이름이 숨은 문서까지</text>

  <!-- card 4: candidate docs -->
  <g filter="url(#shadow)"><rect x="830" y="150" width="210" height="250" rx="20" fill="#ffffff" stroke="#bfdbfe"/></g>
  <circle cx="935" cy="222" r="42" fill="#dbeafe"/>
  <rect x="914" y="200" width="34" height="42" rx="4" fill="#93c5fd"/>
  <rect x="922" y="206" width="34" height="42" rx="4" fill="#2563eb"/>
  <rect x="928" y="216" width="22" height="3" rx="1.5" fill="#ffffff"/>
  <rect x="928" y="224" width="22" height="3" rx="1.5" fill="#ffffff"/>
  <rect x="928" y="232" width="14" height="3" rx="1.5" fill="#ffffff"/>
  <text x="935" y="300" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">후보 문서 20개</text>
  <text x="935" y="330" font-size="14" fill="#64748b" text-anchor="middle">claim과 관련이 높은</text>
  <text x="935" y="350" font-size="14" fill="#64748b" text-anchor="middle">순서로 20개</text>

  <!-- card 5: evidence sentences -->
  <g filter="url(#shadow)"><rect x="1080" y="150" width="210" height="250" rx="20" fill="#ffffff" stroke="#a7f3d0"/></g>
  <circle cx="1185" cy="222" r="42" fill="#d1fae5"/>
  <rect x="1160" y="202" width="50" height="7" rx="3.5" fill="#cbd5e1"/>
  <rect x="1160" y="215" width="50" height="7" rx="3.5" fill="#059669"/>
  <rect x="1160" y="228" width="50" height="7" rx="3.5" fill="#cbd5e1"/>
  <rect x="1160" y="241" width="34" height="7" rx="3.5" fill="#059669"/>
  <text x="1185" y="300" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">근거 문장</text>
  <text x="1185" y="330" font-size="14" fill="#64748b" text-anchor="middle">근거일 확률이 높은</text>
  <text x="1185" y="350" font-size="14" fill="#64748b" text-anchor="middle">문장만 (최대 5개)</text>

  <!-- card 6: verdict -->
  <g filter="url(#shadow)"><rect x="1340" y="150" width="210" height="250" rx="20" fill="#ffffff" stroke="#ddd6fe"/></g>
  <circle cx="1445" cy="222" r="42" fill="#ede9fe"/>
  <path d="M1425,224 l13,13 l26,-28" fill="none" stroke="#7c3aed" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1445" y="300" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">판정</text>
  <rect x="1372" y="318" width="146" height="26" rx="13" fill="#dcfce7"/>
  <text x="1445" y="336" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">SUPPORTED</text>
  <rect x="1372" y="350" width="146" height="26" rx="13" fill="#fee2e2"/>
  <text x="1445" y="368" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">NOT_SUPPORTED</text>

  <!-- arrows -->
  <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round">
    <line x1="268" y1="275" x2="300" y2="275" marker-end="url(#chev)"/>
    <line x1="528" y1="275" x2="560" y2="275" marker-end="url(#chev)"/>
    <line x1="788" y1="275" x2="820" y2="275" marker-end="url(#chev)"/>
    <line x1="1048" y1="275" x2="1070" y2="275" marker-end="url(#chev)"/>
    <line x1="1298" y1="275" x2="1330" y2="275" marker-end="url(#chev)"/>
  </g>

  <!-- tech line -->
  <g font-size="13" fill="#94a3b8" text-anchor="middle">
    <text x="665" y="436">spaCy 개체 추출 · 제목 임베딩 · 위키 링크 그래프 best-first 탐색</text>
    <text x="1185" y="436">cross-encoder</text>
    <text x="1445" y="436">BERT-base</text>
  </g>

  <!-- data source -->
  <rect x="440" y="468" width="450" height="40" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="665" y="494" font-size="14" fill="#475569" text-anchor="middle">위키피디아 2017 첫 단락 · 문서 523만 · 링크 2,268만</text>
  <line x1="665" y1="468" x2="665" y2="446" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
</svg>
